<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应收账款分析看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --primary:#1f3a93; --primary2:#3a5ba0; --accent:#f58518;
  --bg:#f0f3f9; --card:#ffffff; --border:#e3e8ef; --text:#2b2f38; --muted:#8a93a6;
  --warn:#d62728; --ok:#2ca02c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans CJK SC','Microsoft YaHei',PingFang SC,sans-serif;background:var(--bg);color:var(--text);}
.header{background:linear-gradient(135deg,#1f3a93,#3a5ba0);color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.header h1{font-size:22px;font-weight:700}
.header .sub{opacity:.85;font-size:12px;margin-top:4px}
.header .date{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 40px;}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid var(--primary)}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .num{font-size:24px;font-weight:700;margin-top:6px}
.kpi .ext{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.warn{border-left-color:var(--warn)} .kpi.ok{border-left-color:var(--ok)} .kpi.accent{border-left-color:var(--accent)}

/* 筛选 */
.filters{background:var(--card);border-radius:12px;padding:14px 18px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:4px;min-width:140px}
.fgroup label{font-size:12px;color:var(--muted)}
.fgroup select{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;background:#fff;color:var(--text);cursor:pointer}
.fgroup select:focus{outline:2px solid #c6d3f5;border-color:var(--primary)}
.fgroup input{height:36px;width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;background:#fff;color:var(--text)}
.fgroup input:focus{outline:2px solid #c6d3f5;border-color:var(--primary)}
.btn{height:36px;padding:0 18px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--primary2)}
.btn.reset{background:#e6ebf5;color:var(--primary)}
.btn.mbtn{height:30px;padding:0 12px;border-radius:6px;background:#e6ebf5;color:var(--primary);font-size:12px;margin-left:6px}
.btn.mbtn.active{background:var(--primary);color:#fff}

/* 图表 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid .full{grid-column:1/-1}
.chart-card{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chart-card h3{font-size:15px;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--primary)}
.chart-head{display:flex;justify-content:space-between;align-items:center}
.chart{width:100%;height:320px}
.chart.tall{height:360px}
.chart-sm{height:280px}
#ageTable{margin-top:14px}
#ageTable table th{position:static}

/* 表格 */
.table-card{background:var(--card);border-radius:12px;padding:16px 18px;margin-top:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.table-card h3{font-size:15px;margin-bottom:12px;padding-left:10px;border-left:3px solid var(--accent);display:flex;justify-content:space-between;align-items:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:right;white-space:nowrap}
th{background:#f4f7fc;text-align:center;position:sticky;top:0}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tr:hover{background:#f8fafd}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border)}
.tab{padding:10px 24px;border:none;background:none;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.tab-panel{display:none}
.tab-panel.active{display:block}
.quickbar{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.qbtn{height:30px;padding:0 14px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;font-size:13px;color:var(--text);transition:.2s}
.qbtn:hover{background:#eef3fb}
.qbtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.pager button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button:not(:disabled):hover{background:#eef3fb}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
.badge.red{background:#fde8e8;color:var(--warn)} .badge.yellow{background:#fdf3e3;color:#c77700}
.badge.green{background:#e6f6ec;color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
/* 密码锁屏 */
#lock{position:fixed;inset:0;background:rgba(20,30,60,.92);display:flex;align-items:center;justify-content:center;z-index:9999}
.lock-box{background:#fff;border-radius:14px;padding:36px 40px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:380px;width:90%}
.lock-box h2{margin-bottom:10px;font-size:20px;color:var(--primary)}
.lock-box p{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
.lock-box input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:15px;margin-bottom:12px;box-sizing:border-box}
.lock-box input:focus{outline:2px solid #c6d3f5;border-color:var(--primary)}
.lock-box button{width:100%;height:44px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;cursor:pointer;transition:.2s}
.lock-box button:hover{background:var(--primary2)}
#pwErr{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="lock">
  <div class="lock-box">
    <h2>应收账款分析看板</h2>
    <p>本看板含公司机密数据，请验证访问密码后再进入</p>
    <input type="password" id="pw" placeholder="请输入访问密码" onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()">进入看板</button>
    <div id="pwErr"></div>
  </div>
</div>
<div class="header">
  <div>
    <h1>应收账款分析看板</h1>
    <div class="sub">数据口径：欠款明细实时汇总（期末余额 − 补认领金额）</div>
  </div>
  <div class="date">统计日：2026-08-18</div>
</div>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="overview">看板概览</button>
    <button class="tab" data-tab="detail">欠款明细</button>
    <button class="tab" data-tab="flow">收款流水</button>
  </div>

  <div class="filters" id="filters">
    <div class="fgroup"><label>区域</label><select id="fRegion"></select></div>
    <div class="fgroup"><label>分公司</label><select id="fBranch"></select></div>
    <div class="fgroup"><label>欠款类别</label><select id="fCategory"></select></div>
    <div class="fgroup"><label>账龄段</label><select id="fAge"></select></div>
    <div class="fgroup"><label>充值类型</label><select id="fRecharge"></select></div><div class="fgroup"><label>业务类型</label><select id="fBiz"></select></div><div class="fgroup" style="display:none"><label>销售员</label><input id="fSales" placeholder="输入销售员筛选"></div><div class="fgroup" style="display:none"><label>单位名称</label><input id="fUnit" placeholder="输入单位名称筛选"></div>
    <button class="btn reset" id="btnReset">重置筛选</button>
  </div>

  <div id="tabOverview" class="tab-panel active">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="chart-card full"><h3 class="chart-head">账龄分析（按区域 / 分公司汇总）<button class="btn" id="ageToggle" onclick="toggleAgeDetail()">查看明细</button></h3>
        <div class="chart chart-sm" id="cAgeChart"></div>
        <div class="tbl-wrap" id="ageTable" style="display:none"></div>
      </div>
      <div class="chart-card"><h3>业务类型分析（欠款明细）</h3><div class="chart" id="cBiz"></div></div>
      <div class="chart-card"><h3>充值类型分析（欠款明细）</h3><div class="chart" id="cRecharge"></div></div>
      <div class="chart-card"><h3>还款进账方式分析</h3><div class="chart" id="cMethod"></div></div>
      <div class="chart-card"><h3>单位逾账期 TOP10</h3><div class="chart" id="cCompany"></div></div>
    </div>
  </div>

  <div id="tabDetail" class="tab-panel">
    <div class="table-card">
      <h3><span>欠款明细</span><span id="tblCount" style="font-size:12px;color:var(--muted)"></span><button class="btn" id="monthlyToggle" onclick="toggleDetailMonthly()" style="margin-left:auto;font-size:12px">查看月度汇总</button></h3>
      <div class="quickbar" id="quickBar"></div>
      <div class="tbl-wrap" id="tblWrap"></div>
      <div class="pager">
        <span id="pageInfo"></span>
        <button id="prevPage">上一页</button>
        <button id="nextPage">下一页</button>
      </div>
    </div>
    <div id="detailMonthly" style="display:none"></div>
  </div>

  <div id="tabFlow" class="tab-panel">
    <div class="filters" id="flowFilters">
      <div class="fgroup"><label>区域</label><select id="flRegion"></select></div>
      <div class="fgroup"><label>分公司</label><select id="flBranch"></select></div>
      <div class="fgroup"><label>业务类型</label><select id="flBiz"></select></div>
      <div class="fgroup"><label>销售员</label><input id="flSales" placeholder="输入销售员筛选"></div>
      <div class="fgroup"><label>单位名称</label><input id="flUnit" placeholder="输入单位名称筛选"></div>
      <div class="fgroup"><label>欠款类别</label><select id="flCategory"></select></div>
      <div class="fgroup"><label>还款进账方式</label><select id="flMethod"></select></div>
      <button class="btn reset" id="flReset">重置筛选</button>
    </div>
    <div class="kpis" id="flowKpis"></div>
    <div class="table-card">
      <h3><span>收款流水</span><span id="flowCount" style="font-size:12px;color:var(--muted)"></span></h3>
      <div class="tbl-wrap" id="flowWrap"></div>
      <div class="pager">
        <span id="flowPageInfo"></span>
        <button id="flowPrev">上一页</button>
        <button id="flowNext">下一页</button>
      </div>
    </div>
  </div>

</div>

  const mt=DATA.monthly.reduce((s,r)=>{s.期初+=r.期初;s.回款+=r.回款;s.新增+=r.新增;s.期末+=r.期末;return s;},{期初:0,回款:0,新增:0,期末:0});
  const arr=[
    {l:'期初余额',v:FM(mt.期初*10000),e:'2026年7月末',cls:''},
    {l:'当月新增回款',v:FM(mt.回款*10000),e:'2026年8月',cls:''},
    {l:'当月新增欠款',v:FM(mt.新增*10000),e:'2026年8月',cls:''},
    {l:'期末欠款总额',v:FM(mt.期末*10000),e:n+' 笔',cls:''},
  ];
  document.getElementById('kpis').innerHTML=arr.map(k=>`<div class="kpi ${k.cls}"><div class="lbl">${k.l}</div><div class="num">${k.v}</div><div class="ext">${k.e}</div></div>`).join('');
}
function renderCharts(){
  // 单位逾账期TOP10（实际期末余额不为0，按最大逾账期天数）
  const cmap={};
  filtered.forEach(r=>{
    if((r.实际期末余额||0)===0)return;
    const k=r.单位名称||'未知';
    if(!cmap[k])cmap[k]={max:0,cnt:0,amt:0};
    if((r.欠款天数||0)>cmap[k].max){cmap[k].max=r.欠款天数||0;cmap[k].amt=r.实际期末余额||0;}
    cmap[k].cnt++;
  });
  const cp=Object.keys(cmap).map(k=>({key:k,max:cmap[k].max,cnt:cmap[k].cnt,amt:cmap[k].amt})).sort((a,b)=>b.max-a.max).slice(0,10).reverse();
  echarts.init(document.getElementById('cCompany'),null,{renderer:'canvas'}).setOption({
    tooltip:{trigger:'axis',formatter:p=>p[0].name+'<br>逾账期：'+p[0].value+'天　'+p[0].data.cnt+' 笔'+(p[0].data.amt?'<br>最长逾账期金额：'+(p[0].data.amt/10000).toFixed(2)+' 万':'')},
    grid:{left:10,right:30,top:10,bottom:30,containLabel:true},
    xAxis:{type:'value',axisLabel:{formatter:v=>v+'天'}},
    yAxis:{type:'category',data:cp.map(r=>r.key),axisLabel:{width:180,overflow:'truncate'}},
    series:[{type:'bar',data:cp.map(r=>({value:r.max,cnt:r.cnt,amt:r.amt})),barWidth:'55%',
      itemStyle:{color:'#72b7b2'},label:{show:true,position:'right',formatter:p=>p.value+'天'}}]
  });
  // 账龄柱状图
  const ageOrder=['0-30','31-60','61-90','91-180','181-360','361以上'];
  const ageArr=ageOrder.map(s=>{
    const it=filtered.filter(r=>r.账龄段===s);
    return {name:s, val:it.reduce((a,r)=>a+(r.实际期末余额||0),0), cnt:it.length};
  });
  const ageColor={'0-30':'#2ca02c','31-60':'#98df8a','61-90':'#ffbb78','91-180':'#ff9896','181-360':'#e377c2','361以上':'#d62728'};
  echarts.init(document.getElementById('cAgeChart'),null,{renderer:'canvas'}).setOption({
    tooltip:{trigger:'axis',formatter:p=>p[0].name+'<br>金额：'+FM(p[0].value)+'　'+p[0].data.cnt+' 笔'},
    grid:{left:10,right:10,top:30,bottom:30,containLabel:true},
    xAxis:{type:'category',data:ageArr.map(a=>a.name+'天')},
    yAxis:{type:'value',axisLabel:{formatter:v=>v/10000+'万'}},
    series:[{type:'bar',data:ageArr.map(a=>({value:a.val,cnt:a.cnt})),barWidth:'50%',
      itemStyle:{color:p=>ageColor[ageArr[p.dataIndex].name]},
      label:{show:true,position:'top',formatter:p=>FM(p.value)}}]
  });
}

function renderAgeTable(){
  const order=['0-30','31-60','61-90','91-180','181-360','361以上'];
  const el=document.getElementById('ageTable');
  function W2(v){return (v/10000).toFixed(2);}
  if(!filtered.length){el.innerHTML='<div class="empty">暂无数据</div>';return;}
  const rmap={};
  filtered.forEach(r=>{
    const key=r.区域+'|'+r.分公司;
    if(!rmap[key])rmap[key]={区域:r.区域,分公司:r.分公司,segs:{}};
    const seg=r.账龄段||'未知';
    rmap[key].segs[seg]=(rmap[key].segs[seg]||0)+(r.实际期末余额||0);
  });
  const rows=Object.values(rmap).sort((a,b)=>a.区域.localeCompare(b.区域)||a.分公司.localeCompare(b.分公司));
  const colTotal={};order.forEach(s=>colTotal[s]=0);
  let grand=0;
  let h='<table><thead><tr><th>区域</th><th>分公司</th>'+order.map(s=>'<th>'+s+'天</th>').join('')+'<th>合计(万元)</th></tr></thead><tbody>';
  let curRegion='', rs=null;
  const flush=()=>{
    if(rs){
      let rt=0;order.forEach(s=>rt+=rs[s]);
      h+='<tr style="background:#f0f4fb"><td><b>'+curRegion+'小计</b></td><td></td>'+order.map(s=>'<td><b>'+W2(rs[s])+'</b></td>').join('')+'<td><b>'+W2(rt)+'</b></td></tr>';
    }
  };
  rows.forEach(r=>{
    if(r.区域!==curRegion){flush();curRegion=r.区域;rs={};order.forEach(s=>rs[s]=0);}
    let row='<tr><td>'+r.区域+'</td><td>'+r.分公司+'</td>';let t=0;
    order.forEach(s=>{const v=r.segs[s]||0;t+=v;rs[s]+=v;colTotal[s]+=v;row+='<td>'+W2(v)+'</td>';});
    grand+=t;row+='<td><b>'+W2(t)+'</b></td></tr>';h+=row;
  });
  flush();
  h+='<tr style="background:#e7eef9"><td><b>合计</b></td><td></td>'+order.map(s=>'<td><b>'+W2(colTotal[s])+'</b></td>').join('')+'<td><b>'+W2(grand)+'</b></td></tr>';
  el.innerHTML=h+'</tbody></table>';
}
function renderMonthly(){
  const el=document.getElementById('monthlyTable');
  const src=DATA.monthly||[];
  if(!src.length){el.innerHTML='<div class="empty">暂无数据</div>';return;}
  const rows=src.filter(r=>filters.region==='全部'||r.区域===filters.region);
  const order=['苏州二区','南通区域','苏北区域','安徽区域'];
  const regions=order.filter(rg=>rows.some(r=>r.区域===rg));
  let G={期初:0,回款:0,新增:0,期末:0};
  let h='<table><thead><tr><th>区域</th><th>分公司</th><th>期初余额</th><th>2026年8月<br>欠款回款</th><th>2026年8月<br>新增欠款</th><th>2026年8月<br>期末欠款余额(实际期末余额)</th></tr></thead><tbody>';
  regions.forEach(rg=>{
    const sub=rows.filter(r=>r.区域===rg);
    let S={期初:0,回款:0,新增:0,期末:0};
    sub.forEach(r=>{S.期初+=r.期初;S.回款+=r.回款;S.新增+=r.新增;S.期末+=r.期末;G.期初+=r.期初;G.回款+=r.回款;G.新增+=r.新增;G.期末+=r.期末;
      h+='<tr><td>'+rg+'</td><td>'+r.分公司+'</td><td>'+FMT.format(r.期初)+'</td><td>'+FMT.format(r.回款)+'</td><td>'+FMT.format(r.新增)+'</td><td>'+FMT.format(r.期末)+'</td></tr>';
    });
    h+='<tr style="background:#f0f4fb"><td><b>'+rg+'小计</b></td><td></td><td><b>'+FMT.format(S.期初)+'</b></td><td><b>'+FMT.format(S.回款)+'</b></td><td><b>'+FMT.format(S.新增)+'</b></td><td><b>'+FMT.format(S.期末)+'</b></td></tr>';
  });
  h+='<tr style="background:#e7eef9"><td><b>合计</b></td><td></td><td><b>'+FMT.format(G.期初)+'</b></td><td><b>'+FMT.format(G.回款)+'</b></td><td><b>'+FMT.format(G.新增)+'</b></td><td><b>'+FMT.format(G.期末)+'</b></td></tr>';
  el.innerHTML=h+'</tbody></table>';
}
function renderTable(){
  const el=document.getElementById('tblWrap');
  if(!filtered.length){el.innerHTML='<div class="empty">暂无符合条件的数据</div>';document.getElementById('tblCount').textContent='共 0 条';document.getElementById('pageInfo').textContent='0 条';return;}
  const totalPages=Math.ceil(filtered.length/PER);
  if(page>totalPages)page=totalPages;
  const start=(page-1)*PER,end=Math.min(page*PER,filtered.length);
  const rows=filtered.slice(start,end);
  document.getElementById('tblCount').textContent='共 '+filtered.length+' 条';
  document.getElementById('pageInfo').textContent='第 '+page+' / '+totalPages+' 页';
  document.getElementById('prevPage').disabled=page<=1;
  document.getElementById('nextPage').disabled=page>=totalPages;
  let h='<table><thead><tr><th>区域</th><th>分公司</th><th>销售员</th><th>业务类型</th><th>欠款类别</th><th>充值类型</th><th>单位名称</th><th>激活日期</th><th>逾账期</th><th>实际期末余额</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const d=r.欠款天数;
    const badge=d>90?'<span class="badge red">'+d+'天</span>':(d>60?'<span class="badge yellow">'+d+'天</span>':'<span class="badge green">'+d+'天</span>');
    h+=`<tr><td>${r.区域}</td><td>${r.分公司}</td><td>${r.销售员}</td><td>${r.业务类型}</td><td>${r.欠款类别}</td><td>${r.充值类型}</td><td title="${r.单位名称||''}">${(r.单位名称||'').length>12?(r.单位名称||'').slice(0,12)+'…':(r.单位名称||'')}</td><td>${r.激活日期}</td><td>${badge}</td><td>${FMT.format(r.实际期末余额)}</td></tr>`;
  });
  el.innerHTML=h+'</tbody></table>';
}
function uni(arr){return ['全部',...new Set(arr)].filter(function(x){return x;});}
function pDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function realtimeAge(){
  var now=new Date();now.setHours(0,0,0,0);
  DATA.明细.forEach(function(r){
    var d=Math.round((now-pDate(r.激活日期))/86400000);if(d<0)d=0;
    var o=d-60;if(o<0)o=0;
    r.欠款天数=o;
    r.账龄段=o<=30?'0-30':o<=60?'31-60':o<=90?'61-90':o<=180?'91-180':o<=360?'181-360':'361以上';
  });
}
function initSelects(){
  const regs=uni(DATA.明细.map(r=>r.区域));

  document.getElementById('fRegion').onchange=e=>{filters.region=e.target.value;filters.branch='全部';page=1;
    const br=uni(DATA.明细.filter(r=>filters.region==='全部'||r.区域===filters.region).map(r=>r.分公司));

  document.getElementById('fBiz').onchange=e=>{filters.biz=e.target.value;page=1;refresh();};
  document.getElementById('fSales').oninput=e=>{filters.sales=e.target.value.trim();page=1;refresh();};
  document.getElementById('fUnit').oninput=e=>{filters.unit=e.target.value.trim();page=1;refresh();};

}
function renderQuick(){
  const QUICK=['全部','0-30','31-60','61-90','91-180','181-360','361以上'];
  document.getElementById('quickBar').innerHTML='快速筛选账龄：'+QUICK.map(q=>{
    const active=(q==='全部'&&filters.age==='全部')||(q!=='全部'&&filters.age===q);
    const label=q==='全部'?'全部':q+'天';
    return '<button class="qbtn'+(active?' active':'')+'" onclick="setQuick(\''+q+'\')">'+label+'</button>';
  }).join('');
}
function setQuick(q){
  filters.age=(q==='全部')?'全部':q;
  document.getElementById('fAge').value=filters.age;
  page=1;refresh();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('tabOverview').classList.toggle('active',name==='overview');
  document.getElementById('tabDetail').classList.toggle('active',name==='detail');
  document.getElementById('tabFlow').classList.toggle('active',name==='flow');
  document.getElementById('filters').style.display=(name==='flow')?'none':'';
  var su=(name!=='overview');
  ['fSales','fUnit'].forEach(function(id){var el=document.getElementById(id);if(el)el.parentElement.style.display=su?'':'none';});
  if(name==='flow')refreshFlow();
  setTimeout(()=>{['cCompany','cAgeChart','cBiz','cRecharge','cMethod'].forEach(id=>{const c=echarts.getInstanceByDom(document.getElementById(id));if(c)c.resize();});},120);
}

let flf={region:'全部',branch:'全部',biz:'全部',category:'全部',method:'全部',sales:'',unit:''};
let flpage=1, flPER=15, flFiltered=[];
function uniF(arr){return ['全部',...new Set(arr)].filter(function(x){return x;});}
function fillF(id,opts){document.getElementById(id).innerHTML=opts.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('');}
function fillFlowUnits(){}
function initFlowSelects(){
  fillF('flRegion',uniF(FLOW.map(function(r){return r.区域;})));
  fillF('flBiz',uniF(FLOW.map(function(r){return r.业务类型;})));
  fillF('flCategory',uniF(FLOW.map(function(r){return r.欠款类别;})));
  fillF('flMethod',uniF(FLOW.map(function(r){return r.还款进账方式;})));
  fillFlowBranches();
}
function fillFlowBranches(){
  var rows=FLOW;
  if(flf.region!=='全部')rows=rows.filter(function(r){return r.区域===flf.region;});
  fillF('flBranch',uniF(rows.map(function(r){return r.分公司;})));
}
function applyFlowFilter(){
  flFiltered=FLOW.filter(function(r){
    if(flf.region!=='全部'&&r.区域!==flf.region)return false;
    if(flf.branch!=='全部'&&r.分公司!==flf.branch)return false;
    if(flf.biz!=='全部'&&r.业务类型!==flf.biz)return false;
    if(flf.category!=='全部'&&r.欠款类别!==flf.category)return false;
    if(flf.method!=='全部'&&r.还款进账方式!==flf.method)return false;
    if(flf.sales&&r.销售员.indexOf(flf.sales)===-1)return false;
    if(flf.unit&&r.单位名称.indexOf(flf.unit)===-1)return false;
    return true;
  });
}
function renderFlowKPI(){
  var n=flFiltered.length;
  var total=flFiltered.reduce(function(s,r){return s+(r.还款进账金额||0);},0);
  var gz=flFiltered.filter(function(r){return r.是否对公进账==='是';});
  var gzN=gz.length;
  var gzAmt=gz.reduce(function(s,r){return s+(r.还款进账金额||0);},0);
  var pct=n?(gzN/n*100).toFixed(0):0;
  var arr=[
    {l:'回款笔数',v:n+' 笔',e:'共 '+FLOW.length+' 条流水',cls:''},
    {l:'回款总额',v:FM(total),e:'按还款进账金额',cls:'ok'},
    {l:'对公进账笔数',v:gzN+' 笔',e:'占 '+pct+'%',cls:''},
    {l:'对公进账金额',v:FM(gzAmt),e:'对公进账合计',cls:'accent'}
  ];
  document.getElementById('flowKpis').innerHTML=arr.map(function(k){return '<div class="kpi '+k.cls+'"><div class="lbl">'+k.l+'</div><div class="num">'+k.v+'</div><div class="ext">'+k.e+'</div></div>';}).join('');
}
function renderFlow(){
  var el=document.getElementById('flowWrap');
  document.getElementById('flowCount').textContent='共 '+flFiltered.length+' 条';
  if(!flFiltered.length){el.innerHTML='<div class="empty">暂无符合条件的数据</div>';document.getElementById('flowPageInfo').textContent='0 条';return;}
  var totalPages=Math.ceil(flFiltered.length/flPER);
  if(flpage>totalPages)flpage=totalPages;
  var start=(flpage-1)*flPER,end=Math.min(flpage*flPER,flFiltered.length);
  var rows=flFiltered.slice(start,end);
  document.getElementById('flowPageInfo').textContent='第 '+flpage+' / '+totalPages+' 页';
  document.getElementById('flowPrev').disabled=flpage<=1;
  document.getElementById('flowNext').disabled=flpage>=totalPages;
  var h='<table><thead><tr><th>区域</th><th>分公司</th><th>销售员</th><th>业务类型</th><th>充值类型</th><th>欠款类别</th><th>单位名称</th><th>期初余额</th><th>还款进账日期</th><th>还款进账金额</th><th>还款进账方式</th><th>是否对公进账</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var g=r.是否对公进账==='是';
    h+='<tr><td>'+r.区域+'</td><td>'+r.分公司+'</td><td>'+r.销售员+'</td><td>'+r.业务类型+'</td><td>'+r.充值类型+'</td><td>'+r.欠款类别+'</td><td title="'+r.单位名称+'">'+(r.单位名称.length>12?r.单位名称.slice(0,12)+'…':r.单位名称)+'</td><td>'+FMT.format(r.期初余额)+'</td><td>'+r.还款进账日期+'</td><td>'+FMT.format(r.还款进账金额)+'</td><td>'+r.还款进账方式+'</td><td>'+(g?'<span class="badge green">是</span>':'<span class="badge yellow">否</span>')+'</td></tr>';
  });
  el.innerHTML=h+'</tbody></table>';
}
function refreshFlow(){applyFlowFilter();renderFlowKPI();renderFlow();}
function bindFlow(){
  document.getElementById('flRegion').onchange=function(e){flf.region=e.target.value;flf.branch='全部';flpage=1;fillFlowBranches();fillFlowUnits();document.getElementById('flBranch').value='全部';refreshFlow();};
  document.getElementById('flBranch').onchange=function(e){flf.branch=e.target.value;flpage=1;fillFlowUnits();refreshFlow();};
  document.getElementById('flBiz').onchange=function(e){flf.biz=e.target.value;flpage=1;refreshFlow();};
  document.getElementById('flCategory').onchange=function(e){flf.category=e.target.value;flpage=1;refreshFlow();};
  document.getElementById('flMethod').onchange=function(e){flf.method=e.target.value;flpage=1;refreshFlow();};
  document.getElementById('flSales').oninput=function(e){flf.sales=e.target.value.trim();flpage=1;refreshFlow();};
  document.getElementById('flUnit').oninput=function(e){flf.unit=e.target.value.trim();flpage=1;refreshFlow();};
  document.getElementById('flReset').onclick=function(){flf={region:'全部',branch:'全部',biz:'全部',category:'全部',method:'全部',sales:'',unit:''};flpage=1;document.getElementById('flSales').value='';document.getElementById('flUnit').value='';initFlowSelects();refreshFlow();};
  document.getElementById('flowPrev').onclick=function(){if(flpage>1){flpage--;renderFlow();}};
  document.getElementById('flowNext').onclick=function(){flpage++;renderFlow();};
}

  var el=document.getElementById('detailMonthly');
  var src=DATA.monthly||[];
  if(!src.length){el.innerHTML='<div class="empty">暂无数据</div>';return;}
  var rows=src.filter(function(r){return filters.region==='全部'||r.区域===filters.region;});
  var order=['苏州一区','苏州二区','南通区域','无锡区域','常州区域','南京区域','北京区域','苏北区域','安徽区域','广东区域','浙江区域','上海区域','苏中区域'];
  var regions=order.filter(function(rg){return rows.some(function(r){return r.区域===rg;});});
  var modes=[['汇总','汇总'],['预充值业务','预充值业务'],['非预充值业务','非预充值业务']];
  var btns='';
  modes.forEach(function(mm){btns+='<button class="btn mbtn'+(monthlyMode===mm[0]?' active':'')+'" onclick="setMonthlyMode(\''+mm[0]+'\')">'+mm[1]+'</button>';});
  var G={期初:0,回款:0,新增:0,期末:0};
  var h='<div class="table-card"><h3>月度欠款汇总（单位：万元 · 2026年8月）<span style="float:right">'+btns+'</span></h3><table><thead><tr><th>区域</th><th>分公司</th><th>期初余额</th><th>2026年8月<br>欠款回款</th><th>2026年8月<br>新增欠款</th><th>2026年8月<br>期末欠款余额(实际期末余额)</th></tr></thead><tbody>';
  regions.forEach(function(rg){
    var sub=rows.filter(function(r){return r.区域===rg;});
    var S={期初:0,回款:0,新增:0,期末:0};
    sub.forEach(function(r){var v=monthlyVal(r);S.期初+=v.期初;S.回款+=v.回款;S.新增+=v.新增;S.期末+=v.期末;G.期初+=v.期初;G.回款+=v.回款;G.新增+=v.新增;G.期末+=v.期末;
      h+='<tr><td>'+rg+'</td><td>'+r.分公司+'</td><td>'+FMT.format(v.期初)+'</td><td>'+FMT.format(v.回款)+'</td><td>'+FMT.format(v.新增)+'</td><td>'+FMT.format(v.期末)+'</td></tr>';});
    h+='<tr style="background:#f0f4fb"><td><b>'+rg+'小计</b></td><td></td><td><b>'+FMT.format(S.期初)+'</b></td><td><b>'+FMT.format(S.回款)+'</b></td><td><b>'+FMT.format(S.新增)+'</b></td><td><b>'+FMT.format(S.期末)+'</b></td></tr>';
  });
  h+='<tr style="background:#e7eef9"><td><b>合计</b></td><td></td><td><b>'+FMT.format(G.期初)+'</b></td><td><b>'+FMT.format(G.回款)+'</b></td><td><b>'+FMT.format(G.新增)+'</b></td><td><b>'+FMT.format(G.期末)+'</b></td></tr>';
  el.innerHTML=h+'</tbody></table></div>';
}
function monthlyVal(r){
  if(monthlyMode==='预充值业务'){return {期初:r.预期初,回款:r.预回款,新增:r.预新增,期末:r.预期末};}
  if(monthlyMode==='非预充值业务'){return {期初:r.非预期初,回款:r.非预回款,新增:r.非预新增,期末:r.非预期末};}
  return {期初:r.期初,回款:r.回款,新增:r.新增,期末:r.期末};
}
function setMonthlyMode(m){monthlyMode=m;renderDetailMonthly();}
function renderDimChart(id,key,src){
  const arr=src==='detail'?DATA.明细:FLOW;
  const map={};
  arr.forEach(r=>{
    const k=r[key]||'未知';
    if(!map[k])map[k]={cnt:0,amt:0};
    map[k].cnt++; map[k].amt+=(src==='detail'?(r.实际期末余额||0):(r.还款进账金额||0));
  });
  const items=Object.keys(map).map(k=>({name:k,cnt:map[k].cnt,amt:map[k].amt})).sort((a,b)=>b.amt-a.amt);
  const names=items.map(x=>x.name), cnts=items.map(x=>x.cnt), amts=items.map(x=>x.amt/10000);
  const el=document.getElementById(id);
  if(!el)return;
  echarts.init(el,null,{renderer:'canvas'}).setOption({
    tooltip:{trigger:'axis',formatter:function(params){
      var s=params[0].name+'<br/>';
      params.forEach(function(p){
        var val=p.seriesName==='金额(万元)'?p.value.toFixed(2):p.value;
        s+=p.marker+p.seriesName+'：'+val+'<br/>';
      });
      return s;
    }},
    legend:{data:['金额(万元)','笔数'],top:0},
    grid:{left:10,right:10,top:34,bottom:24,containLabel:true},
    xAxis:{type:'category',data:names},
    yAxis:[{type:'value',name:'金额(万元)',axisLabel:{formatter:function(v){return v.toFixed(2);}}},{type:'value',name:'笔数',splitLine:{show:false}}],
    series:[
      {name:'金额(万元)',type:'bar',data:amts,yAxisIndex:0,barWidth:'32%',itemStyle:{color:'#4c78a8'},label:{show:true,position:'top',formatter:function(p){return p.value.toFixed(2);}}},
      {name:'笔数',type:'bar',data:cnts,yAxisIndex:1,barWidth:'32%',itemStyle:{color:'#f58518'},label:{show:true,position:'top'}}
    ]
  });
}
function renderFlowCharts(){renderDimChart('cBiz','业务类型','detail');renderDimChart('cRecharge','充值类型','detail');renderDimChart('cMethod','还款进账方式','flow');}
initFlowSelects();bindFlow();refreshFlow();renderFlowCharts();

</script>
